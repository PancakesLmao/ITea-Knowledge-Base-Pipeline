name: "Terraform Pipeline"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "validated" to proceed with apply (only active on main branch)'
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL_S3: "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  # Job 1: Plan (Runs on ALL branches)
  plan:
    name: "1. Terraform Plan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize Backend
        run: |
          terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Generate Plan
        run: |
          terraform plan -no-color -out=tfplan | tee plan_output.txt

      - name: Post Plan to GitHub Step Summary
        run: |
          echo "### Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat plan_output.txt | tail -n 25 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Archive Execution Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  # Job 2: Validation Gate (Only on main branch)
  validation_gate:
    name: "2. Validation Gate"
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify "validated" Confirmation Input
        run: |
          echo "Checking user confirmation input..."
          if [ "${{ github.event.inputs.confirmation }}" != "validated" ]; then
            echo "❌ Approval input was: '${{ github.event.inputs.confirmation }}'"
            echo "⚠️ To apply changes on main, re-run workflow with confirmation set to: validated"
            exit 1
          fi
          echo "✅ Code verified. Proceeding to deploy."

  # Job 3: Deploy / Apply (Only on main branch after validation)
  deploy:
    name: "3. Terraform Apply"
    needs: [plan, validation_gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize Backend
        run: |
          terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Download Execution Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Apply Approved Plan
        run: |
          terraform apply tfplan

      - name: Post Apply Result to Summary
        run: |
          echo "### ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Terraform plan successfully applied on \`${{ github.ref_name }}\`." >> $GITHUB_STEP_SUMMARY
