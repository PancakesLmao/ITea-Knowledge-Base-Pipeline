name: "Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/**'
      - '.tflint.hcl'

permissions:
  contents: read

concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL_S3: "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_tags: >-
    {"application":"${{ vars.APPLICATION }}","created_by":"terraform","environment":"${{ vars.ENVIRONMENT || 'production' }}"}

jobs:
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Initialize Backend
        run: |
          terraform init -backend-config="bucket=${{ env.TF_STATE_BUCKET }}"

      - name: Apply Configuration
        run: |
          terraform apply -auto-approve
